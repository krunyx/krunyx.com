site_name: krunyx
site_url: https://krunyx.com/
site_description: krunyx builds a computing environment for scientists. Our first release is HyperTeX, a web you write in TeX.
site_author: krunyx
copyright: © 2026 krunyx

repo_url: https://github.com/krunyx/hypertex
repo_name: hypertex
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/krunyx-mark.svg
  favicon: assets/images/krunyx-mark.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  # Dark is the default. The light scheme stays available through the toggle.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - HyperTeX:
      - Overview: hypertex/index.md
      - Download: hypertex/download.md
      - Get started: hypertex/getting-started.md
      - Cite: hypertex/cite.md
      - Changelog: hypertex/changelog.md
  - Roadmap: roadmap.md
  - Security: security.md
  - Company: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - assets/javascripts/translate.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  generator: false
  # Language menu. English is the original; the others open the current page
  # through Google Translate (assets/javascripts/translate.js fills in the page path).
  alternate:
    - name: English
      link: /
      lang: en
    - name: 한국어
      link: /
      lang: ko
    - name: 日本語
      link: /
      lang: ja
    - name: 中文 (简体)
      link: /
      lang: zh-CN
    - name: Deutsch
      link: /
      lang: de
    - name: Français
      link: /
      lang: fr
    - name: Español
      link: /
      lang: es
  hypertex:
    version: "0.1.0"
    releases: https://github.com/krunyx/hypertex/releases/latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krunyx
      name: krunyx on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:hello@krunyx.com
      name: hello@krunyx.com
